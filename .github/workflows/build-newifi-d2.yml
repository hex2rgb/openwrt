name: Build OpenWrt for Newifi D2

on:
  push:
    branches:
      - release-23.05.6
    # 只有推送 release-23.05.6 分支时才会触发编译
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
  release:
    types: [created]

permissions:
  contents: write
  packages: read

env:
  TZ: Asia/Shanghai
  CONFIG_FILE: .config.newifi-d2-optimized

jobs:
  build:
    name: Build Firmware
    runs-on: ubuntu-latest
    timeout-minutes: 180
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ccache \
            ecj \
            fastjar \
            file \
            g++ \
            gcc \
            gawk \
            gettext \
            git \
            java-propose-classpath \
            libelf-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            python3-pip \
            rsync \
            unzip \
            wget \
            zlib1g-dev \
            libc6-dev \
            libstdc++6 \
            subversion \
            flex \
            bison \
            which \
            binutils \
            bzip2 \
            diffutils \
            findutils \
            grep \
            patch \
            perl

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.ccache
            ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Copy configuration
        run: |
          cp ${{ env.CONFIG_FILE }} .config
          make defconfig

      - name: Download dependencies
        run: |
          make download -j$(nproc)

      - name: Set default IP and password
        run: |
          # Set default IP to 192.168.123.1
          sed -i 's/192\.168\.1\.1/192.168.123.1/g' package/base-files/files/bin/config_generate
          # Set default password to admin (using openssl passwd)
          HASHED_PASSWORD=$(openssl passwd -1 admin)
          sed -i "s|root:[^:]*:|root:$HASHED_PASSWORD:|g" package/base-files/files/etc/shadow || true
          # Alternative method if shadow doesn't exist yet
          if ! grep -q "^root:" package/base-files/files/etc/shadow 2>/dev/null; then
            echo "root:$HASHED_PASSWORD:0:0:99999:7:::" > package/base-files/files/etc/shadow.tmp
            cat package/base-files/files/etc/shadow >> package/base-files/files/etc/shadow.tmp 2>/dev/null || true
            mv package/base-files/files/etc/shadow.tmp package/base-files/files/etc/shadow
          fi

      - name: Build firmware
        run: |
          export GO111MODULE=on
          export GOPROXY=https://proxy.golang.org,direct
          export GOSUMDB=sum.golang.org
          make -j$(($(nproc) + 1)) V=s 2>&1 | tee build.log || {
            echo "=== ❌ Build failed ==="
            echo "=== Showing last 100 lines of build.log ==="
            tail -100 build.log
            echo "=== Searching for error patterns ==="
            grep -i "error\|failed\|cannot\|undefined" build.log | tail -50 || echo "No error patterns found"
            exit 1
          }

      - name: Check firmware files
        id: firmware_check
        continue-on-error: true
        run: |
          FIRMWARE_DIR="bin/targets/ramips/mt7621"
          
          echo "=== Checking firmware directory ==="
          if [ ! -d "$FIRMWARE_DIR" ]; then
            echo "❌ Directory not found: $FIRMWARE_DIR"
            echo "exists=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "Directory exists, listing files:"
          ls -lah "$FIRMWARE_DIR/" || true
          
          # Try to find firmware file with pattern matching
          FIRMWARE_FILE=$(find "$FIRMWARE_DIR" -name "*newifi-d2*.bin" -o -name "*d-team*.bin" | head -1)
          
          if [ -z "$FIRMWARE_FILE" ]; then
            echo "❌ No firmware file found matching pattern"
            echo "Searching for any .bin files:"
            find "$FIRMWARE_DIR" -type f -name "*.bin" || echo "No .bin files found"
            echo "exists=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "✅ Firmware found: $FIRMWARE_FILE"
          FIRMWARE_SIZE=$(du -h "$FIRMWARE_FILE" | cut -f1)
          FIRMWARE_MD5=$(md5sum "$FIRMWARE_FILE" | cut -d' ' -f1)
          FIRMWARE_SHA256=$(sha256sum "$FIRMWARE_FILE" | cut -d' ' -f1)
          
          echo "Size: $FIRMWARE_SIZE"
          echo "MD5: $FIRMWARE_MD5"
          echo "SHA256: $FIRMWARE_SHA256"
          
          echo "file=$FIRMWARE_FILE" >> $GITHUB_OUTPUT
          echo "size=$FIRMWARE_SIZE" >> $GITHUB_OUTPUT
          echo "md5=$FIRMWARE_MD5" >> $GITHUB_OUTPUT
          echo "sha256=$FIRMWARE_SHA256" >> $GITHUB_OUTPUT
          echo "exists=true" >> $GITHUB_OUTPUT

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-newifi-d2-firmware
          path: |
            bin/targets/ramips/mt7621/
            build.log
          retention-days: 30
          if-no-files-found: warn

      - name: Create Release
        if: success() && steps.firmware_check.outputs.exists == 'true'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ steps.firmware_check.outputs.file }}
            bin/targets/ramips/mt7621/*.manifest
          tag_name: newifi-d2-${{ github.run_number }}
          name: OpenWrt for Newifi D2 - Build ${{ github.run_number }}
          body: |
            ## OpenWrt Firmware for Newifi D2

            ### Hardware
            - CPU: MediaTek MT7621A @ 880MHz
            - RAM: 512MB DDR3
            - Flash: 32MB

            ### Features
            - ✅ xray-core (Modern protocol + Low CPU)
            - ✅ PassWall2 (Transparent proxy)
            - ✅ WireGuard (Fast VPN)
            - ✅ SmartDNS (Smart DNS resolution)
            - ✅ Full iptables support (TProxy ready)

            ### Firmware Info
            - **Size**: ${{ steps.firmware_check.outputs.size }}
            - **MD5**: `${{ steps.firmware_check.outputs.md5 }}`
            - **SHA256**: `${{ steps.firmware_check.outputs.sha256 }}`

            ### Installation
            1. Download the `sysupgrade.bin` file
            2. Log in to your router's LuCI interface
            3. Go to System → Backup/Flash Firmware
            4. Upload and flash the firmware

            ### Build Info
            - **Commit**: ${{ github.sha }}
            - **Workflow**: ${{ github.workflow }}
            - **Run ID**: ${{ github.run_id }}

            ### Notes
            - This firmware includes PassWall2 feeds from xiaorouji
            - Make sure to backup your configuration before upgrading
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
